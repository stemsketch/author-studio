name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: author-studio
    steps:
      - uses: actions/checkout@v4
        with:
          path: author-studio
      - name: Mint GitHub App token for sibling repositories
        id: app-token
        if: ${{ vars.STEMSKETCH_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.STEMSKETCH_APP_ID }}
          private-key: ${{ secrets.STEMSKETCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: stemsketch-ir,stemsketch-compiler
      - uses: actions/checkout@v4
        with:
          repository: stemsketch/stemsketch-ir
          path: stemsketch-ir
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || secrets.STEMSKETCH_CHECKOUT_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: stemsketch/stemsketch-compiler
          path: stemsketch-compiler
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || secrets.STEMSKETCH_CHECKOUT_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: author-studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format-check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
