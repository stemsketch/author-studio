name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: author-studio
    steps:
      - uses: actions/checkout@v4
        with:
          path: author-studio
      - uses: actions/checkout@v4
        with:
          repository: stemsketch/stemsketch-ir
          path: stemsketch-ir
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: author-studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format-check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
